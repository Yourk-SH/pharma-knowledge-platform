services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: python api.py
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=host.docker.internal
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis

  web:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8502:8501"
    environment:
      - API_BASE=http://api:8000
      - TZ=Asia/Shanghai
    depends_on:
      - api